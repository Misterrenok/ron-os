name: system-cloud-ci

on:
  push:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'system/lifeup/CALIBRATION_SPEC.md'
      - 'system/lifeup/SHOP_SPEC.md'
      - 'system/lifeup/STARTER_SHOP_CANDIDATES.json'
      - 'skills/system-controller.md'
      - 'architecture/changes/2026-09-10-system-cloud-core-v1.json'
      - 'architecture/changes/2026-09-10-system-db-action-gate-v1.json'
      - 'architecture/changes/2026-09-11-system-profile-domain-v1.json'
      - 'architecture/changes/2026-09-11-system-calibration-v1.json'
      - 'architecture/changes/2026-09-11-chatgpt-system-controller-v1.json'
      - 'architecture/changes/2026-09-11-system-quest-v2.json'
      - 'architecture/changes/2026-09-11-quest-v2-deploy-entrypoint-fix.json'
      - 'architecture/changes/2026-09-11-system-quest-difficulty-v1.json'
      - 'architecture/changes/2026-09-11-system-deadline-automation-v1.json'
      - 'architecture/changes/2026-09-12-system-shop-policy-v1.json'
  pull_request:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'system/lifeup/CALIBRATION_SPEC.md'
      - 'system/lifeup/SHOP_SPEC.md'
      - 'system/lifeup/STARTER_SHOP_CANDIDATES.json'
      - 'skills/system-controller.md'
      - 'architecture/changes/2026-09-10-system-cloud-core-v1.json'
      - 'architecture/changes/2026-09-10-system-db-action-gate-v1.json'
      - 'architecture/changes/2026-09-11-system-profile-domain-v1.json'
      - 'architecture/changes/2026-09-11-system-calibration-v1.json'
      - 'architecture/changes/2026-09-11-chatgpt-system-controller-v1.json'
      - 'architecture/changes/2026-09-11-system-quest-v2.json'
      - 'architecture/changes/2026-09-11-quest-v2-deploy-entrypoint-fix.json'
      - 'architecture/changes/2026-09-11-system-quest-difficulty-v1.json'
      - 'architecture/changes/2026-09-11-system-deadline-automation-v1.json'
      - 'architecture/changes/2026-09-12-system-shop-policy-v1.json'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm install --ignore-scripts
      - name: Test System model
        working-directory: system/lifeup/cloud
        run: npm test

  postgres-action-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm install --ignore-scripts
      - name: Test PostgreSQL gate
        working-directory: system/lifeup/cloud
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
        run: npm test
      - name: Smoke-test HTTP through PostgreSQL gate
        working-directory: system/lifeup/cloud
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
          PGSSL: disable
          SYSTEM_BEARER_TOKEN: postgres-ci-bearer
        run: |
          set -euo pipefail
          node -e "import('pg').then(async m=>{const pg=m.default??m; const Pool=pg.Pool??m.Pool; const pool=new Pool({connectionString:process.env.DATABASE_URL,ssl:false}); await pool.query('TRUNCATE system_push_deliveries, system_push_subscriptions, system_events RESTART IDENTITY'); await pool.end();})"
          node src/server-v2.mjs >/tmp/system-postgres.log 2>&1 &
          pid=$!
          trap 'cat /tmp/system-postgres.log || true; kill "$pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"action_gate":"postgres-function"' /tmp/health.json
          grep -q '"model_version":"quest-v2"' /tmp/health.json
          grep -q '"shop_policy":"system-shop-economy:v1"' /tmp/health.json

          create_code=$(curl --silent --output /tmp/pg-create.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/pg-replay.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/pg-conflict.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q2","title":"Different Postgres HTTP quest"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          profile_code=$(curl --silent --output /tmp/pg-profile.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-profile-1' -H 'Content-Type: application/json' \
            --data '{"type":"profile.calibrate","payload":{"level":1,"xp_to_next":500,"economy_status":"CALIBRATED","evidence":{"status":"verified","source":"ci","ref":"ci:calibration-v1"}}}' \
            http://127.0.0.1:8080/api/v1/actions)
          snapshot_code=$(curl --silent --output /tmp/pg-snapshot.json --write-out '%{http_code}' \
            -H 'Authorization: Bearer postgres-ci-bearer' \
            http://127.0.0.1:8080/api/v1/snapshot)

          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          test "$profile_code" = "201"
          test "$snapshot_code" = "200"
          grep -q '"replay":false' /tmp/pg-create.json
          grep -q '"replay":true' /tmp/pg-replay.json
          grep -q '"event_type":"profile.calibrated"' /tmp/pg-profile.json
          grep -q '"level_policy_ref":"system-level-xp:v1"' /tmp/pg-profile.json
          grep -q '"reward_policy_ref":"system-quest-reward:v1"' /tmp/pg-profile.json
          grep -q '"model_version":"quest-v2"' /tmp/pg-snapshot.json
          grep -q '"level":1' /tmp/pg-snapshot.json
          grep -q '"xp_to_next":500' /tmp/pg-snapshot.json
          grep -q '"rank":null' /tmp/pg-snapshot.json
          grep -q '"economy_status":"CALIBRATED"' /tmp/pg-snapshot.json

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build cloud System image
        run: docker build -f system/lifeup/cloud/Dockerfile -t ron-system-core:test .
      - name: Smoke-test independent cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ron-system-core \
            -p 18081:8080 \
            -e SYSTEM_ALLOW_EPHEMERAL=1 \
            -e SYSTEM_BEARER_TOKEN=ci-test-bearer \
            -e DEADLINE_SWEEP_INTERVAL_MS=5000 \
            ron-system-core:test
          trap 'docker logs ron-system-core || true; docker rm -f ron-system-core >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          health_code=$(curl --silent --output /tmp/ephemeral-health.json --write-out '%{http_code}' http://127.0.0.1:18081/healthz)
          unauth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/v1/snapshot)
          auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer ci-test-bearer' http://127.0.0.1:18081/api/v1/snapshot)
          session_code=$(curl --silent --dump-header /tmp/session-headers.txt --output /tmp/session.json --write-out '%{http_code}' \
            -X POST -H 'Origin: http://127.0.0.1:18081' -H 'X-System-Client: ron-system-pwa-v1' -H 'Content-Type: application/json' \
            --data '{"token":"ci-test-bearer"}' http://127.0.0.1:18081/api/v1/session)
          session_cookie=$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/{sub(/\r$/, ""); split($2, part, ";"); print part[1]}' /tmp/session-headers.txt)
          session_auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Cookie: $session_cookie" http://127.0.0.1:18081/api/v1/snapshot)
          csrf_denied_code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H "Cookie: $session_cookie" -H 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:18081/api/v1/push/subscriptions)
          ui_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)
          runtime_code=$(curl --silent --output /tmp/runtime-capabilities.json --write-out '%{http_code}' http://127.0.0.1:18081/runtime-capabilities.json)
          create_code=$(curl --silent --output /tmp/create.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/replay.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/conflict.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q2","title":"Different quest"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          bad_basis_code=$(curl --silent --output /tmp/bad-basis.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-award-1' -H 'Content-Type: application/json' \
            --data '{"type":"progression.award","payload":{"xp":5,"coins":0,"basis_event_id":"missing","evidence":{"status":"verified","source":"live-owner","ref":"ci"}}}' \
            http://127.0.0.1:18081/api/v1/actions)
          profile_code=$(curl --silent --output /tmp/profile.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-profile-1' -H 'Content-Type: application/json' \
            --data '{"type":"profile.calibrate","payload":{"level":1,"xp_to_next":500,"economy_status":"CALIBRATED","evidence":{"status":"verified","source":"ci","ref":"ci:calibration-v1"}}}' \
            http://127.0.0.1:18081/api/v1/actions)

          test "$health_code" = "200"
          test "$unauth_code" = "401"
          test "$auth_code" = "200"
          test "$session_code" = "201"
          test -n "$session_cookie"
          test "$session_auth_code" = "200"
          test "$csrf_denied_code" = "403"
          test "$ui_code" = "200"
          test "$runtime_code" = "200"
          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          test "$bad_basis_code" = "400"
          test "$profile_code" = "201"
          grep -q '"model_version":"quest-v2"' /tmp/ephemeral-health.json
          grep -q '"deadline_engine":"deadline-v1"' /tmp/ephemeral-health.json
          grep -q '"shop_policy":"system-shop-economy:v1"' /tmp/ephemeral-health.json
          grep -q '"shop_policy": "system-shop-economy:v1"' /tmp/runtime-capabilities.json
          grep -q '"event_type":"profile.calibrated"' /tmp/profile.json
