name: system-cloud-ci

on:
  push:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'system/lifeup/CALIBRATION_SPEC.md'
      - 'system/lifeup/SHOP_SPEC.md'
      - 'system/lifeup/XMIND_STRATEGY_BRIDGE_SPEC.md'
      - 'system/lifeup/STARTER_SHOP_CANDIDATES.json'
      - 'skills/system-controller.md'
      - 'architecture/changes/2026-09-16-system-public-url-access-v1.json'
  pull_request:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'system/lifeup/CALIBRATION_SPEC.md'
      - 'system/lifeup/SHOP_SPEC.md'
      - 'system/lifeup/XMIND_STRATEGY_BRIDGE_SPEC.md'
      - 'system/lifeup/STARTER_SHOP_CANDIDATES.json'
      - 'skills/system-controller.md'
      - 'architecture/changes/2026-09-16-system-public-url-access-v1.json'

concurrency:
  group: system-cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm ci --ignore-scripts
      - name: Test System model
        working-directory: system/lifeup/cloud
        run: npm test

  postgres-action-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Start preinstalled PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb system
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d system
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm ci --ignore-scripts
      - name: Test PostgreSQL gate
        working-directory: system/lifeup/cloud
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
        run: npm test
      - name: Smoke-test anonymous HTTP through PostgreSQL gate
        working-directory: system/lifeup/cloud
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
          PGSSL: disable
        run: |
          set -euo pipefail
          node -e "import('pg').then(async m=>{const pg=m.default??m; const Pool=pg.Pool??m.Pool; const pool=new Pool({connectionString:process.env.DATABASE_URL,ssl:false}); await pool.query('TRUNCATE system_push_deliveries, system_push_subscriptions, system_events RESTART IDENTITY'); await pool.end();})"
          node src/server-v2.mjs >/tmp/system-postgres.log 2>&1 &
          pid=$!
          trap 'cat /tmp/system-postgres.log || true; kill "$pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/health.json; then break; fi
            sleep 1
          done

          grep -q '"action_gate":"postgres-function"' /tmp/health.json
          grep -q '"model_version":"quest-v2"' /tmp/health.json
          grep -q '"access_mode":"public-url"' /tmp/health.json
          grep -q '"authentication_required":false' /tmp/health.json

          capabilities_code=$(curl --silent --output /tmp/pg-capabilities.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/capabilities)
          snapshot_before_code=$(curl --silent --output /tmp/pg-snapshot-before.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/snapshot)
          create_code=$(curl --silent --output /tmp/pg-create.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/pg-replay.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/pg-conflict.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q2","title":"Different Postgres HTTP quest"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          profile_code=$(curl --silent --output /tmp/pg-profile.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-pg-http-profile-1' -H 'Content-Type: application/json' \
            --data '{"type":"profile.calibrate","payload":{"level":1,"xp_to_next":500,"economy_status":"CALIBRATED","evidence":{"status":"verified","source":"ci","ref":"ci:calibration-v1"}}}' \
            http://127.0.0.1:8080/api/v1/actions)
          snapshot_code=$(curl --silent --output /tmp/pg-snapshot.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/snapshot)

          test "$capabilities_code" = "200"
          test "$snapshot_before_code" = "200"
          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          test "$profile_code" = "201"
          test "$snapshot_code" = "200"
          grep -q '"authentication_required":false' /tmp/pg-capabilities.json
          grep -q '"bearer_token":false' /tmp/pg-capabilities.json
          grep -q '"replay":false' /tmp/pg-create.json
          grep -q '"replay":true' /tmp/pg-replay.json
          grep -q '"event_type":"profile.calibrated"' /tmp/pg-profile.json
          grep -q '"level":1' /tmp/pg-snapshot.json
          grep -q '"economy_status":"CALIBRATED"' /tmp/pg-snapshot.json

  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build cloud System image
        run: docker build -f system/lifeup/cloud/Dockerfile -t ron-system-core:test .
      - name: Smoke-test zero-credential cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ron-system-core \
            -p 18081:8080 \
            -e SYSTEM_ALLOW_EPHEMERAL=1 \
            -e DEADLINE_SWEEP_INTERVAL_MS=5000 \
            ron-system-core:test
          trap 'docker logs ron-system-core || true; docker rm -f ron-system-core >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/tmp/ephemeral-health.json; then break; fi
            sleep 1
          done

          health_code=$(curl --silent --output /tmp/ephemeral-health.json --write-out '%{http_code}' http://127.0.0.1:18081/healthz)
          snapshot_code=$(curl --silent --output /tmp/ephemeral-snapshot.json --write-out '%{http_code}' http://127.0.0.1:18081/api/v1/snapshot)
          capabilities_code=$(curl --silent --output /tmp/ephemeral-capabilities.json --write-out '%{http_code}' http://127.0.0.1:18081/api/v1/capabilities)
          session_code=$(curl --silent --dump-header /tmp/session-headers.txt --output /tmp/session.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:18081/api/v1/session)
          ui_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)
          runtime_code=$(curl --silent --output /tmp/runtime-capabilities.json --write-out '%{http_code}' http://127.0.0.1:18081/runtime-capabilities.json)
          create_code=$(curl --silent --output /tmp/create.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/replay.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/conflict.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q2","title":"Different quest"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          bad_basis_code=$(curl --silent --output /tmp/bad-basis.json --write-out '%{http_code}' \
            -X POST -H 'Idempotency-Key: ci-award-1' -H 'Content-Type: application/json' \
            --data '{"type":"progression.award","payload":{"xp":5,"coins":0,"basis_event_id":"missing","evidence":{"status":"verified","source":"live-owner","ref":"ci"}}}' \
            http://127.0.0.1:18081/api/v1/actions)

          test "$health_code" = "200"
          test "$snapshot_code" = "200"
          test "$capabilities_code" = "200"
          test "$session_code" = "201"
          ! grep -qi '^set-cookie:' /tmp/session-headers.txt
          test "$ui_code" = "200"
          test "$runtime_code" = "200"
          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          test "$bad_basis_code" = "400"
          grep -q '"access_mode":"public-url"' /tmp/ephemeral-health.json
          grep -q '"authentication_required":false' /tmp/ephemeral-capabilities.json
          grep -q '"bearer_token":false' /tmp/ephemeral-capabilities.json
          grep -q '"connected":true' /tmp/session.json
          grep -q '"method":"public-url"' /tmp/session.json
          grep -q '"shop_policy": "system-reward-economy:v2"' /tmp/runtime-capabilities.json
          grep -q '"replay":false' /tmp/create.json
          grep -q '"replay":true' /tmp/replay.json
