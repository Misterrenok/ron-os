name: system-cloud-ci

on:
  push:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'architecture/changes/2026-09-10-system-cloud-core-v1.json'
      - 'architecture/changes/2026-09-10-system-db-action-gate-v1.json'
  pull_request:
    paths:
      - '.github/workflows/system-cloud-ci.yml'
      - 'system/lifeup/cloud/**'
      - 'architecture/changes/2026-09-10-system-cloud-core-v1.json'
      - 'architecture/changes/2026-09-10-system-db-action-gate-v1.json'

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm install --ignore-scripts
      - name: Test System model
        working-directory: system/lifeup/cloud
        run: npm test

  postgres-action-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install System dependencies
        working-directory: system/lifeup/cloud
        run: npm install --ignore-scripts
      - name: Test PostgreSQL gate
        working-directory: system/lifeup/cloud
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
        run: npm test
      - name: Smoke-test HTTP through PostgreSQL gate
        working-directory: system/lifeup/cloud
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/system
          PGSSL: disable
          SYSTEM_BEARER_TOKEN: postgres-ci-bearer
        run: |
          set -euo pipefail
          node src/server.mjs >/tmp/system-postgres.log 2>&1 &
          pid=$!
          trap 'cat /tmp/system-postgres.log || true; kill "$pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"action_gate":"postgres-function"' /tmp/health.json

          create_code=$(curl --silent --output /tmp/pg-create.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/pg-replay.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q1","title":"Postgres HTTP quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:8080/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/pg-conflict.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer postgres-ci-bearer' -H 'Idempotency-Key: ci-pg-http-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-pg-http-q2","title":"Different Postgres HTTP quest"}}' \
            http://127.0.0.1:8080/api/v1/actions)

          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          grep -q '"replay":false' /tmp/pg-create.json
          grep -q '"replay":true' /tmp/pg-replay.json

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build cloud System image
        run: docker build -f system/lifeup/cloud/Dockerfile -t ron-system-core:test .
      - name: Smoke-test independent cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ron-system-core \
            -p 18081:8080 \
            -e SYSTEM_ALLOW_EPHEMERAL=1 \
            -e SYSTEM_BEARER_TOKEN=ci-test-bearer \
            ron-system-core:test
          trap 'docker logs ron-system-core || true; docker rm -f ron-system-core >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          health_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/healthz)
          unauth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/v1/snapshot)
          auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer ci-test-bearer' http://127.0.0.1:18081/api/v1/snapshot)
          ui_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)
          create_code=$(curl --silent --output /tmp/create.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          replay_code=$(curl --silent --output /tmp/replay.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q1","title":"CI quest","class":"SIDE","rank":"E"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          conflict_code=$(curl --silent --output /tmp/conflict.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-quest-create-1' -H 'Content-Type: application/json' \
            --data '{"type":"quest.create","payload":{"quest_id":"ci-q2","title":"Different quest"}}' \
            http://127.0.0.1:18081/api/v1/actions)
          bad_basis_code=$(curl --silent --output /tmp/bad-basis.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer ci-test-bearer' -H 'Idempotency-Key: ci-award-1' -H 'Content-Type: application/json' \
            --data '{"type":"progression.award","payload":{"xp":5,"basis_event_id":"missing","evidence":{"status":"verified","source":"live-owner","ref":"ci"}}}' \
            http://127.0.0.1:18081/api/v1/actions)

          test "$health_code" = "200"
          test "$unauth_code" = "401"
          test "$auth_code" = "200"
          test "$ui_code" = "200"
          test "$create_code" = "201"
          test "$replay_code" = "200"
          test "$conflict_code" = "409"
          test "$bad_basis_code" = "400"
