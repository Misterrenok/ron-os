name: continuity-guard

on:
  push:
  pull_request:

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Architecture Mode manifests
        run: python tests/architecture_change_guard.py
      - name: Self-test Architecture Mode guard
        run: python tests/architecture_change_guard_selftest.py
      - name: Run continuity coverage guard
        run: python tests/continuity_coverage_guard.py
      - name: Self-test continuity coverage guard
        run: python tests/continuity_coverage_guard_selftest.py
      - name: Run XMind skill regression
        run: python tests/xmind_skill_regression.py
      - name: Self-test XMind snapshot diff
        run: python tests/xmind_snapshot_diff_selftest.py
