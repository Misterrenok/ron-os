name: continuity-guard

on:
  push:
    paths-ignore:
      - 'system/lifeup/cloud/public/**'
      - 'system/lifeup/cloud/test/pwa-contract.test.mjs'
      - 'system/lifeup/cloud/test/projection.test.mjs'
      - '.github/workflows/system-pwa-ci.yml'
  pull_request:
    paths-ignore:
      - 'system/lifeup/cloud/public/**'
      - 'system/lifeup/cloud/test/pwa-contract.test.mjs'
      - 'system/lifeup/cloud/test/projection.test.mjs'
      - '.github/workflows/system-pwa-ci.yml'

concurrency:
  group: continuity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate Architecture Mode manifests and change gate
        env:
          ARCH_BASE: ${{ github.event.before }}
          ARCH_HEAD: ${{ github.sha }}
        run: python3 tests/architecture_change_guard.py
      - name: Self-test Architecture Mode guard
        run: python3 tests/architecture_change_guard_selftest.py
      - name: Guard temporary resource lifecycle
        run: python3 tests/resource_lifecycle_guard.py
      - name: Guard Astra meta-objective routing
        run: python3 tests/astra_meta_mode_guard.py
      - name: Run continuity coverage guard
        run: python3 tests/continuity_coverage_guard.py
      - name: Self-test continuity coverage guard
        run: python3 tests/continuity_coverage_guard_selftest.py
      - name: Guard opportunistic maintenance routing
        run: python3 tests/maintenance_opportunistic_guard.py
      - name: Guard System fast-path blocker deferral
        run: python3 tests/system_execution_fast_path_guard.py
      - name: Run System controller routing guard
        run: python3 tests/system_controller_routing_guard.py
      - name: Guard continuation resilience routing
        run: python3 tests/continuation_resilience_guard.py
      - name: Run Skill and Social Capital regression guard
        run: python3 tests/capital_system_guard.py
      - name: Run XMind skill regression
        run: python3 tests/xmind_skill_regression.py
      - name: Self-test XMind snapshot diff
        run: python3 tests/xmind_snapshot_diff_selftest.py
