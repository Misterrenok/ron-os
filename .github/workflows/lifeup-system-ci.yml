name: lifeup-system-ci

on:
  push:
    paths:
      - '.github/workflows/lifeup-system-ci.yml'
      - 'system/lifeup/northflank/**'
      - 'system/lifeup/SYSTEM_SPEC.md'
      - 'projects/lifeup-system.md'
      - 'skills/lifeup-system.md'
      - 'skills/system-controller.md'
      - 'tests/lifeup_system_guard.py'
      - 'tests/lifeup_ci_scope.py'
      - 'tests/system_controller_routing_guard.py'
      - 'references/domain-routing.md'
      - 'references/continuity-owner-registry.tsv'
      - 'BOOTSTRAP.md'
      - 'CURRENT.md'
      - 'architecture/changes/2026-09-09-lifeup-system-v1.json'
      - 'architecture/changes/2026-09-11-chatgpt-system-controller-v1.json'
      - 'architecture/changes/2026-09-11-system-quest-difficulty-v1.json'
      - 'architecture/changes/2026-09-15-system-reward-economy-v2.json'
      - 'architecture/changes/2026-09-16-retired-lifeup-ci-scope-v1.json'
  pull_request:
    paths:
      - '.github/workflows/lifeup-system-ci.yml'
      - 'system/lifeup/northflank/**'
      - 'system/lifeup/SYSTEM_SPEC.md'
      - 'projects/lifeup-system.md'
      - 'skills/lifeup-system.md'
      - 'skills/system-controller.md'
      - 'tests/lifeup_system_guard.py'
      - 'tests/lifeup_ci_scope.py'
      - 'tests/system_controller_routing_guard.py'
      - 'references/domain-routing.md'
      - 'references/continuity-owner-registry.tsv'
      - 'BOOTSTRAP.md'
      - 'CURRENT.md'
      - 'architecture/changes/2026-09-09-lifeup-system-v1.json'
      - 'architecture/changes/2026-09-11-chatgpt-system-controller-v1.json'
      - 'architecture/changes/2026-09-11-system-quest-difficulty-v1.json'
      - 'architecture/changes/2026-09-15-system-reward-economy-v2.json'
      - 'architecture/changes/2026-09-16-retired-lifeup-ci-scope-v1.json'

concurrency:
  group: lifeup-system-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self-test retired LifeUp Docker scope
        run: python tests/lifeup_ci_scope.py --self-test
      - name: Validate retired LifeUp / current System contract
        run: python tests/lifeup_system_guard.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect legacy rollback implementation change
        id: legacy-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$EVENT_BEFORE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$GITHUB_SHA^")"
          fi

          mapfile -t changed_paths < <(git diff --name-only "$base" "$GITHUB_SHA")
          required="$(python tests/lifeup_ci_scope.py "${changed_paths[@]}")"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          printf 'Legacy rollback Docker required: %s\n' "$required"
          printf 'Changed paths:\n%s\n' "${changed_paths[*]:-<none>}"
      - name: Build legacy remote LifeUp MCP image
        if: steps.legacy-scope.outputs.required == 'true'
        run: docker build -f system/lifeup/northflank/Dockerfile -t ron-lifeup-mcp:test .
      - name: Smoke-test legacy container startup and auth boundary
        if: steps.legacy-scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name ron-lifeup-mcp \
            -p 18080:8080 \
            -e MCP_BEARER_TOKEN=ci-test-bearer \
            -e LIFEUP_HOST=127.0.0.1:13276 \
            ron-lifeup-mcp:test
          trap 'docker logs ron-lifeup-mcp || true; docker rm -f ron-lifeup-mcp >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          health_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/healthz)
          auth_code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/mcp)
          test "$health_code" = "200"
          test "$auth_code" = "401"
