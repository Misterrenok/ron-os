name: Build experimental GSM2SIP for J5 Android 7
on:
  push:
    branches:
      - experiment/gsm2sip-j5-android7
    paths:
      - "experiments/gsm2sip-j5/**"
      - ".github/workflows/gsm2sip-j5-android7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android platform 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
      - name: Get fixed upstream sources and apply Android 7 patch
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pulpoff/gsm2sip.git upstream
          cd upstream
          git checkout --detach d5266651a01514bb8485c4451eccf3f818943f4e
          git apply --check ../experiments/gsm2sip-j5/android7.patch
          git apply ../experiments/gsm2sip-j5/android7.patch
          git apply --check ../experiments/gsm2sip-j5/crashfix-android7.patch
          git apply ../experiments/gsm2sip-j5/crashfix-android7.patch
          # Regression guards: platform APIs must be gated for Android 7.1.
          grep -q 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU' app/src/main/java/com/callagent/gateway/MainActivity.kt
          grep -q 'Build.VERSION.SDK_INT >= Build.VERSION_CODES.P' app/src/main/java/com/callagent/gateway/MainActivity.kt
          git diff --check
          echo "Patch applied to pinned upstream revision"
      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Package experimental Magisk module and integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          install -d magisk/system/priv-app/Gateway
          cp app/build/outputs/apk/debug/app-debug.apk magisk/system/priv-app/Gateway/Gateway.apk
          # Magisk 30.6: use modern customize.sh, not broken legacy install.sh.
          cp ../experiments/gsm2sip-j5/customize-magisk30.sh magisk/customize.sh
          cp ../experiments/gsm2sip-j5/uninstall-magisk30.sh magisk/uninstall.sh
          rm -f magisk/install.sh magisk/post-fs-data.sh magisk/system.prop
          rm -rf magisk/META-INF magisk/system/priv-app/PermissionController
          python3 - <<'PY'
          from pathlib import Path
          p = Path("magisk/module.prop")
          s = p.read_text()
          assert "version=v1.3.0-android7-exp" in s
          p.write_text(s.replace("version=v1.3.0-android7-exp", "version=v1.3.0-android7-magisk30-crashfix").replace("versionCode=375", "versionCode=377"))
          p = Path("magisk/service.sh")
          s = p.read_text()
          old = """if [ -n "$TINYMIX_SRC" ] && [ -f "$TINYMIX_SRC" ]; then
              cp "$TINYMIX_SRC" /data/local/tmp/tinymix
              chmod 755 /data/local/tmp/tinymix
              chown root:root /data/local/tmp/tinymix
              log -t "$TAG" "tinymix: installed $DEVICE_ABI binary to /data/local/tmp/tinymix"
          else"""
          new = """if [ -n "$TINYMIX_SRC" ] && [ -f "$TINYMIX_SRC" ]; then
              if [ -e /data/local/tmp/tinymix ]; then
                  log -t "$TAG" "tinymix: preserving pre-existing /data/local/tmp/tinymix"
              else
                  cp "$TINYMIX_SRC" /data/local/tmp/tinymix && {
                      chmod 755 /data/local/tmp/tinymix
                      chown root:root /data/local/tmp/tinymix
                      log -t "$TAG" "tinymix: installed $DEVICE_ABI binary to /data/local/tmp/tinymix"
                      touch "$MODDIR/.j5_created_local_tinymix"
                  }
              fi
          else"""
          assert old in s, "Upstream tinymix code changed"
          p.write_text(s.replace(old, new))
          PY
          bash -n magisk/customize.sh magisk/uninstall.sh magisk/service.sh
          (cd magisk && zip -qr ../gateway-magisk-j5-magisk30-fixed.zip .)
          ! unzip -Z1 gateway-magisk-j5-magisk30-fixed.zip | grep -Eq '(^install.sh$|^system.prop$|^post-fs-data.sh$|PermissionController)'
          unzip -tq gateway-magisk-j5-magisk30-fixed.zip
          cmp -s magisk/system/priv-app/Gateway/Gateway.apk app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk gateway-j5-android7-exp.apk
          sha256sum gateway-j5-android7-exp.apk gateway-magisk-j5-magisk30-fixed.zip > SHA256SUMS
      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-j5-magisk30-crashfix
          path: |
            upstream/gateway-j5-android7-exp.apk
            upstream/gateway-magisk-j5-magisk30-fixed.zip
            upstream/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
