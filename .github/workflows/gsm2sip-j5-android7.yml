name: Build experimental GSM2SIP for J5 Android 7
on:
  push:
    branches:
      - experiment/gsm2sip-j5-android7
    paths:
      - "experiments/gsm2sip-j5/**"
      - ".github/workflows/gsm2sip-j5-android7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Ensure Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Get fixed upstream sources and apply Android 7 patch
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/pulpoff/gsm2sip.git upstream
          cd upstream
          git checkout --detach d5266651a01514bb8485c4451eccf3f818943f4e
          git apply --check ../experiments/gsm2sip-j5/android7.patch
          git apply ../experiments/gsm2sip-j5/android7.patch
          git diff --check
          echo "Patch applied to pinned upstream revision"
      - name: Build debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug
      - name: Package experimental Magisk module and integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          install -d magisk/system/priv-app/Gateway
          cp app/build/outputs/apk/debug/app-debug.apk magisk/system/priv-app/Gateway/Gateway.apk
          (cd magisk && zip -qr ../gateway-magisk-j5-android7-exp.zip .)
          cp app/build/outputs/apk/debug/app-debug.apk gateway-j5-android7-exp.apk
          sha256sum gateway-j5-android7-exp.apk gateway-magisk-j5-android7-exp.zip > SHA256SUMS
      - name: Upload experimental build
        uses: actions/upload-artifact@v4
        with:
          name: gsm2sip-j5-android7-experimental
          path: |
            upstream/gateway-j5-android7-exp.apk
            upstream/gateway-magisk-j5-android7-exp.zip
            upstream/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
