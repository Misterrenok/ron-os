name: temp-source-export
on:
  push:
    branches: [system-standing-autonomy-v1]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: auth-cleanup-source
          path: |
            system/lifeup/cloud/public/app-v2.js
            system/lifeup/cloud/public/index-v2.html
            system/lifeup/cloud/public/sw-v2.js
            system/lifeup/cloud/src/server-v2.mjs
            .github/workflows/system-cloud-ci.yml
          if-no-files-found: error
